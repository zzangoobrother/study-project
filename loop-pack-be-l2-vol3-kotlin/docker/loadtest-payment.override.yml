# 결제 회복탄력성 측정용 구성. (2026-10-13 결제 설계 11.2 장)
#
# 기본 파일(loadtest-compose.yml)은 주문 · 캐시 측정의 재현 조건이라 고치지 않고, 결제용 차이를 이 파일에만 둔다.
# commerce-api → PG 사이에 Toxiproxy 를 두어 지연(가설 3)과 장애(가설 2)를 원본 수정 없이 넣는다.
# pg-simulator 는 callbackUrl 제약 때문에 컨테이너가 아니라 호스트에서 띄운다(호스트 8082).
# pg.callback-url 은 기본값(http://localhost:8080/...)을 그대로 둔다 — 호스트의 PG 가 호스트 8080 으로 콜백하면 컨테이너로 이어진다.
#
# Toxiproxy 는 컨테이너가 아니라 호스트에서 띄운다(호스트 18082 → localhost:8082). 컨테이너 Toxiproxy 에서 호스트 PG 로
# 나가는 구간(Docker Desktop VM → 호스트)이 간헐적으로 약 64 s 멈춰, 읽기 타임아웃(Unknown)이 몰리며 가설 1 의 서킷이 열렸다.
# 같은 부하에서 컨테이너 → 호스트 직접 경로는 2,400 회 중 1 s 초과 0 회였으므로, 프록시를 호스트로 옮겨 그 구간을 없앤다.
# (2026-10-20 가설 1 측정 불성립 조사)
#
# 사용: docker compose -f docker/loadtest-compose.yml -f docker/loadtest-payment.override.yml up -d --remove-orphans
#       (호스트에서 toxiproxy-server 를 띄우고 loadtest/pg-proxy.sh create — Toxiproxy 는 재시작하면 프록시를 잊는다)
services:
  commerce-api:
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 호스트의 Toxiproxy 로 나간다
    environment:
      PG_BASE_URL: http://host.docker.internal:18082
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"   # tomcat_threads_busy_threads 지표
    ports:
      - "8081:8081"   # actuator — 샘플러가 호스트에서 읽는다
