# 결제 회복탄력성 측정용 구성. (2026-10-13 결제 설계 11.2 장)
#
# 기본 파일(loadtest-compose.yml)은 주문 · 캐시 측정의 재현 조건이라 고치지 않고, 결제용 차이를 이 파일에만 둔다.
# commerce-api → PG 사이에 Toxiproxy 를 두어 지연(가설 3)과 장애(가설 2)를 원본 수정 없이 넣는다.
#
# 구성 이력 — 컨테이너 → 호스트 구간(Docker Desktop host.docker.internal)이 두 번 문제를 일으켰다.
#   1) 컨테이너 Toxiproxy → 호스트 PG: 이 구간이 가끔 약 64 s 멈춰 읽기 타임아웃이 몰리며 가설 1 의 서킷이 열렸다.
#      (2026-10-20 가설 1 측정 불성립 조사) → Toxiproxy 를 호스트로 옮김.
#   2) 호스트 Toxiproxy: 가설 1(10 rps)은 참이었으나, 결제 70 rps(가설 3)에서 connect timeout(500 ms)이 몰려
#      서킷이 B 는 T0+54 s, C 는 T0+40 s 에 열렸다. 부하 7 배에 connect timeout 은 약 44 배였다 → 가설 3 불성립.
#      (2026-10-21 가설 3 측정 불성립 조사)
#   3) 그래서 컨테이너 → 호스트 구간 자체를 없앤다: pg-simulator 와 Toxiproxy 를 모두 컨테이너로 두어
#      모든 트래픽이 Docker 브리지 망 안에서만 흐르게 한다. 꺼진 프록시도 컨테이너끼리라 진짜 RST(연결 거부)를 돌려준다.
#
# pg-simulator 는 commerce-api 의 네트워크 네임스페이스를 공유한다(network_mode: "service:commerce-api").
# PG 는 callbackUrl 이 http://localhost:8080 으로 시작해야 받는다(원래 PG 를 호스트에 둔 유일한 이유).
# 네임스페이스를 공유하면 PG 안의 localhost:8080 이 곧 commerce-api 이므로 이 제약이 그대로 만족된다.
# pg.callback-url 은 기본값(http://localhost:8080/...)을 그대로 둔다.
#
# 방향이 "PG 가 commerce-api 에 붙음"인 이유: Compose v2.20.2 에는 `!reset` 이 없어 기본 파일 commerce-api 의 `ports` 를
# 지울 수 없다. network_mode 와 ports 는 함께 쓸 수 없으므로 commerce-api 가 남의 네임스페이스에 붙을 수 없다.
# 대가: 네임스페이스 소유자(commerce-api)를 재시작하면 붙어 있던 PG 가 네트워크를 잃는다.
#   → pg-simulator stop → commerce-api restart → pg-simulator start 순서를 지킨다. PG 를 살려 둔 채 commerce-api 를 재시작하면
#     PG 의 MySQL 연결이 종료 신호 없이 남아 재시작마다 새고, 결국 max_connections 에 닿는다(2026-10-22 확인).
#   PG 헬스체크는 자기 루프백만 보므로 네트워크를 잃어도 healthy 로 남는다 — 순서로만 막는다.
#   재시작 직후 PG 는 JIT 가 덜 돌아 70 rps 에서 p99 1.9 s(읽기 타임아웃 1 s 초과)라, 측정 전에 데우고 그 거래를 TRUNCATE 한다(loadtest/README.md).
# 네임스페이스 소유자만 포트를 열 수 있으므로 PG 의 8082 도 commerce-api 의 ports 로 연다(기본 파일 ports 에 덧붙는다).
#
# CPU(Docker Desktop VM 5 CPU): mysql 2(기본 파일) + commerce-api 2.25 + pg-simulator 0.5 + toxiproxy 0.25 = 5.
# 앱 몫을 3 → 2.25 로 줄인 대가로 가설 1 · 2(앱 3 CPU, 호스트 PG)와 측정 조건이 다르다.
# 가설 3 은 B · C 를 같은 조건에서 비교하므로 판정에는 영향이 없다.
#
# 사용: PG_JAR=pg-simulator-payment-<해시>.jar APP_JAR=commerce-api-payment-<해시>.jar \
#         docker compose -f docker/loadtest-compose.yml -f docker/loadtest-payment.override.yml up -d --remove-orphans
#       loadtest/pg-proxy.sh create   # Toxiproxy 는 컨테이너가 다시 만들어지면 프록시를 잊는다
services:
  commerce-api:
    cpus: "2.25"   # 기본 파일의 3.0 을 덮어쓴다 — PG · Toxiproxy 몫을 앱에서 뗀다
    environment:
      PG_BASE_URL: http://toxiproxy:18082
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"   # tomcat_threads_busy_threads 지표
    ports:
      - "8081:8081"   # actuator — 샘플러가 호스트에서 읽는다
      - "8082:8082"   # 네임스페이스를 공유하는 pg-simulator — P0(k6 pg-direct)가 호스트에서 localhost:8082 로 부른다

  pg-simulator:
    # commerce-api 정의의 관례를 따른다 — Dockerfile 없이 공식 JRE 이미지 + jar 볼륨.
    image: eclipse-temurin:21-jre
    network_mode: "service:commerce-api"   # localhost:8080 이 commerce-api 가 되어 callbackUrl 제약을 만족한다
    cpus: "0.5"
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy
      commerce-api:
        condition: service_started
    environment:
      TZ: UTC
    volumes:
      # PG_JAR 는 다음 bootJar 빌드가 덮어쓰지 않도록 복사해 둔 이름이다(pg-simulator-payment-<해시>.jar).
      - ../apps/pg-simulator/build/libs:/app/libs:ro
    command:
      - java
      - -Xms512m
      - -Xmx512m
      - -jar
      - /app/libs/${PG_JAR}
      - --spring.profiles.active=local
      # show-sql 을 끈다 — 기본 파일 commerce-api 와 같은 이유(쿼리마다 stdout 로깅이 측정에 섞임).
      # 호스트 실행 때는 PG 로그가 294 MB 까지 커졌다.
      - --spring.jpa.show-sql=false
      # local 프로필의 jdbc-url 은 localhost 로 하드코딩돼 있다(modules/jpa/src/main/resources/jpa.yml).
      # 계정(application/application)은 local 프로필 기본값과 같지만 command 에 명시해 둔다.
      - --datasource.mysql-jpa.main.jdbc-url=jdbc:mysql://mysql:3306/paymentgateway
      - --datasource.mysql-jpa.main.username=application
      - --datasource.mysql-jpa.main.password=application
      # 공유 네임스페이스의 localhost:6379 에는 redis 가 없다.
      - --datasource.redis.master.host=redis-master
      - --datasource.redis.master.port=6379
      - --datasource.redis.replicas[0].host=redis-readonly
      - --datasource.redis.replicas[0].port=6379
      # 코어 256: PG 처리량을 결제 70 rps 이상으로 맞춘다(설계 11.2 장). 기본 8 이면 큐가 쌓여 콜백이 몇 분씩 늦는다.
      - --spring.task.execution.pool.core-size=256
    healthcheck:
      # PG 의 management 포트는 8083 이다. 이미지에 curl 이 없어 commerce-api 처럼 bash /dev/tcp 를 쓴다.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8083 &&
          printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    cpus: "0.25"
    ports:
      - "8474:8474"   # 관리 API — loadtest/pg-proxy.sh 가 호스트에서 부른다
