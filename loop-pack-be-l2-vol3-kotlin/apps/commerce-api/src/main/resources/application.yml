server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

# PG 연동 (2026-10-13 결제 설계 6 장). 수치를 바꾸면 PgPaymentGatewayTest 가 깨지는 것이 정상이다.
pg:
  base-url: http://localhost:8082
  callback-url: http://localhost:8080/api/v1/payments/callback
  sync:
    enabled: true

spring.cloud.openfeign.client.config:
  pg-simulator:
    connect-timeout: 500   # 같은 망이면 수 ms. 연결이 안 되면 PG 가 죽은 것이다
    read-timeout: 1000     # PG 최대 지연 500 ms 의 2 배. 길수록 PG 가 느려질 때 스레드를 오래 쥔다

# Bulkhead( CircuitBreaker( Retry( 호출 ) ) ) — 애노테이션 기본 순서(Retry 바깥, Bulkhead 안쪽)의 반대라 뒤집는다(값이 작을수록 바깥).
# 서킷 · 재시도는 아래 aspect-order 로, Bulkhead 는 yml 키가 없어 PgBulkheadOrderConfig 가 0 으로 만든다.
# Bulkhead 가 가장 바깥이라 거절은 첫 시도 전에만 일어난다(NotSent 가 맞다). 서킷이 재시도 바깥인 것도 같은 논리다.
# 순서가 틀려도 에러가 없다. PgPaymentGatewayTest 의 "서킷 실패 1 건" 단언, PgBulkheadConfigTest 의 빈 순서 단언,
# PgPaymentGatewayBulkheadTest.rejectionIsNotRecordedByCircuit 의 서킷 버퍼 2 단언이 잡는다. (2026-10-29 PG 격리 설계 2 장)
resilience4j:
  bulkhead:
    instances:
      pgRequest:
        # 평소 동시 PG 호출 약 32(70 rps x 0.45 s)의 1.5 배. Tomcat 200 중 150 은 PG 와 무관한 API 몫으로 남는다. (설계 3 장)
        max-concurrent-calls: 50
        # 기다리면 그동안 Tomcat 스레드를 쥔다. 기다리는 것 자체가 막으려는 일이라 넘치면 바로 거절한다.
        max-wait-duration: 0
      pgQuery:
        # 조회는 재시도가 없고 빠르다. 콜백 · 수동 동기화 약 7 에 여유를 둔 값이다.
        max-concurrent-calls: 20
        max-wait-duration: 0
  retry:
    retry-aspect-order: 2
    instances:
      pgRequest:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # 같은 순간 5xx 를 받은 요청들의 재시도가 같은 시각에 다시 몰리지 않게 흩는다. 대기는 기준값 x (1 ± 0.25) 균등 무작위다
        # (1 회차 150-250 ms, 2 회차 300-500 ms). 기본 0.5 가 아니라 0.25 인 이유: 백오프 합 최대가 600 -> 750 ms 로만 늘어
        # 요청 최대 점유 5.25 s(IN_FLIGHT 6 s 까지 0.75 s 여유), 정상 PG 재시도 최대 2.25 s(서킷 느린 호출 2.5 s 까지 0.25 s 여유)다.
        # 0.5 면 2.4 s 로 여유가 0.1 s 뿐이라 정상 PG 에서도 느린 호출로 서킷이 열릴 수 있다. (설계 6.2 장)
        enable-randomized-wait: true
        randomized-wait-factor: 0.25
        # 5xx 만 재시도한다. 타임아웃(RetryableException)은 PG 에 이미 저장됐을 수 있어 재시도하면 거래가 하나 더 생긴다.
        # 연결 거부(같은 RetryableException)는 PG 가 죽은 신호라 재시도하지 않고 바로 NotSent 로 돌린다. (설계 6.2 장)
        retry-exceptions:
          - feign.FeignException$FeignServerException
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      pgRequest:
        # 요청 단위로 센다. 평소 요청 실패율은 0.4³ ≈ 6.4% 다. 시도 단위(40%)로 세면 정상 PG 에서도 열린다. (설계 6.3 장)
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        # 재시도까지 포함한 시간이다. 정상 PG 에서도 재시도가 붙으면 최대 2.25 s(jitter 포함)가 걸린다.
        slow-call-duration-threshold: 2500ms
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
        ignore-exceptions:
          - feign.FeignException$FeignClientException
      pgQuery:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 800ms
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
        # 404 는 "거래 없음" 이라는 정상 응답이다.
        ignore-exceptions:
          - feign.FeignException$FeignClientException

