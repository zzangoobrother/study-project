spring:
  config:
    activate:
      on-profile: local, test

loopers:
  admin:
    stub-credentials:
      - id: admin
        password: admin1234

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: test

# 테스트 도중 스케줄러가 끼어들면 결과가 흔들린다. 테스트는 PaymentFacade.syncPending 을 직접 부른다. (설계 10 장)
pg:
  sync:
    enabled: false
