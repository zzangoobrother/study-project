spring:
  datasource:
    url: jdbc:mysql://localhost:3307/url_shortener
    username: root
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

shortener:
  base-url: http://localhost:8080
  key-strategy: random
  random:
    key-length: 7
    max-attempts: 5
  md5:
    key-length: 7
    max-attempts: 5
