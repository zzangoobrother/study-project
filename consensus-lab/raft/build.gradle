// main 클래스가 없는 순수 Java 라이브러리 모듈이므로 실행 가능한 jar는 만들지 않는다.
bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    implementation project(':consensus-lab:sim')

    // 적대 순서 실험에서 flp 모듈의 RandomScheduler를 재사용한다(테스트에서만).
    testImplementation project(':consensus-lab:flp')
    testImplementation project(':consensus-lab:sim')

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
